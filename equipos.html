<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LaLiga en datos — Equipos</title>
<meta name="description" content="Ficha de cada equipo de LaLiga: clasificación, forma reciente, récord en casa y fuera, y próximo partido.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="brandbar"><div class="inner">
  <div class="brand"><span class="mark">⚽</span>LaLiga en datos</div>
  <nav>
    <a href="index.html">Jornada</a>
    <a href="predicciones.html">Previsiones</a>
    <a href="equipos.html" class="on">Equipos</a>
  </nav>
</div></div>

<div class="wrap" style="padding-top:20px">
  <div>
    <h1>Los 20 equipos</h1>
    <p class="sub">Toca un equipo para ver su ficha completa: clasificación, racha, récord como local/visitante y su próximo rival.</p>
  </div>

  <div class="teamgrid" id="teamgrid"></div>

  <div id="teamcards"></div>
</div>

<nav class="bottomnav">
  <a href="index.html"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="4" height="9"/><rect x="10" y="7" width="4" height="13"/><rect x="17" y="3" width="4" height="17"/></svg>Jornada</a>
  <a href="predicciones.html"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>Previsiones</a>
  <a href="equipos.html" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></svg>Equipos</a>
</nav>

<script src="assets/data.js"></script>
<script>
function crestEl(code,size){
  const t=TEAMS[code];
  const d=document.createElement('div');
  d.className='crest '+(size||'');
  d.setAttribute('style',crestStyle(code));
  d.textContent=code;
  return d;
}
function formDots(code){
  const wrap=document.createElement('div'); wrap.className='form-dots';
  [...TEAMS[code].form].forEach(c=>{
    const s=document.createElement('span'); s.className='fd '+c; s.textContent=c; wrap.appendChild(s);
  });
  return wrap;
}
function nextFixture(code){
  const m = FIXTURES.find(f=>f.h===code || f.a===code);
  if(!m) return null;
  const home = m.h===code;
  const rival = home ? m.a : m.h;
  return {rival, home, when:m.when};
}

const rows = standings();
const grid=document.getElementById('teamgrid');
const cardsWrap=document.getElementById('teamcards');

rows.forEach((row,i)=>{
  const pos=i+1;
  const tile=document.createElement('button');
  tile.className='teamtile';
  tile.dataset.code=row.code;
  tile.innerHTML=`<span class="pos-chip">#${pos}</span>`;
  tile.appendChild(crestEl(row.code,'lg'));
  const nm=document.createElement('div'); nm.className='nm'; nm.textContent=row.t.short; tile.appendChild(nm);
  const pts=document.createElement('div'); pts.className='pts2'; pts.textContent=row.pts+' pts'; tile.appendChild(pts);
  grid.appendChild(tile);

  const card=document.createElement('article');
  card.className='teamcard';
  card.id='tc-'+row.code;
  const nf=nextFixture(row.code);
  card.innerHTML = `
    <div class="tc-head">
      <div class="crest-holder"></div>
      <div>
        <h2 class="big">${row.t.n}</h2>
        <p class="pos-chip">#${pos} en la clasificación · ${row.pts} puntos</p>
      </div>
    </div>
    <div class="tc-stats">
      <div class="tc-stat"><b>${row.t.pj}</b><span>Jugados</span></div>
      <div class="tc-stat"><b>${row.t.g}</b><span>Ganados</span></div>
      <div class="tc-stat"><b>${row.t.e}</b><span>Empatados</span></div>
      <div class="tc-stat"><b>${row.t.p}</b><span>Perdidos</span></div>
      <div class="tc-stat"><b>${row.t.gf}</b><span>G. favor</span></div>
      <div class="tc-stat"><b>${row.t.gc}</b><span>G. contra</span></div>
      <div class="tc-stat"><b>${row.dg>0?'+':''}${row.dg}</b><span>Dif. goles</span></div>
    </div>
    <div class="tc-section">
      <h4>Forma — últimos 5 partidos</h4>
      <div class="form-holder"></div>
    </div>
    <div class="tc-section">
      <h4>Récord por localía</h4>
      <div class="hvsplit">
        <div class="box"><b>En casa</b>${row.t.h.g}G · ${row.t.h.e}E · ${row.t.h.p}P (${row.t.h.pj} PJ)</div>
        <div class="box"><b>Fuera</b>${row.t.a.g}G · ${row.t.a.e}E · ${row.t.a.p}P (${row.t.a.pj} PJ)</div>
      </div>
    </div>
    ${nf ? `<div class="tc-section">
      <h4>Próximo partido — Jornada 11</h4>
      <div class="box" style="display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px">
        <div class="nf-crest"></div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">${nf.home?'vs':'@'} ${TEAMS[nf.rival].n}</div>
          <div style="font-size:12px;color:var(--muted);font-family:var(--mono)">${nf.when}</div>
        </div>
        <a href="predicciones.html" style="font-size:13px;font-weight:700">Ver previsión →</a>
      </div>
    </div>` : ''}
  `;
  card.querySelector('.crest-holder').appendChild(crestEl(row.code,'lg'));
  card.querySelector('.form-holder').appendChild(formDots(row.code));
  if(nf) card.querySelector('.nf-crest').appendChild(crestEl(nf.rival,'sm'));
  cardsWrap.appendChild(card);
});

function openTeam(code){
  document.querySelectorAll('.teamcard').forEach(c=>c.classList.remove('on'));
  const target=document.getElementById('tc-'+code);
  target.classList.add('on');
  target.scrollIntoView({behavior:'smooth',block:'start'});
}
grid.addEventListener('click',e=>{
  const btn=e.target.closest('.teamtile');
  if(btn) openTeam(btn.dataset.code);
});

if(location.hash){
  const code=location.hash.slice(1).toUpperCase();
  if(TEAMS[code]) openTeam(code);
}
</script>
</body>
</html>
